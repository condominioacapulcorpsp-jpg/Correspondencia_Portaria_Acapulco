<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Contatos e Moradores — Portaria Acapulco</title>

<style>
:root{
  --azul:#1f2b48;
  --verde:#1fb954;
  --fundo:#f0f2f5;
  --card:#ffffff;
  --muted:#6b7280;
  --danger:#e74c3c;
  --success:#16a34a;
  --sombra: 0 8px 30px rgba(15,23,42,0.12);
  --radius:12px;
  --max-width:950px;
}

body{
  font-family: Inter, "Segoe UI", Arial, sans-serif; 
  margin:0; 
  color:#111;
  background-color: var(--fundo);
  -webkit-font-smoothing:antialiased; 
  -moz-osx-font-smoothing:grayscale;
}

body.tema-escuro{
  --fundo:#0b1220;
  --card:#1e293b;
  color:#e6eef8;
}

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px;
}
.container{
  width:100%;
  max-width:var(--max-width);
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--sombra);
  overflow:hidden;
}

.header{
  display:flex;
  gap:12px;
  align-items:center;
  padding:18px;
  background:linear-gradient(180deg,var(--azul),#16345f);
  color:#fff;
}
.header h1{font-size:18px;margin:0}
.header .meta{font-size:13px;color:rgba(255,255,255,0.85)}

.content{
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
}
.form-control{
  padding:10px 12px;
  border-radius:8px;
  border:1px solid rgba(0,0,0,0.15);
  font-size:14px;
  background:inherit;
  color:inherit;
}
body.tema-escuro .form-control{
  border:1px solid rgba(255,255,255,0.15);
}

.search-input{
  flex:1;
  min-width:240px;
}

/* Tabela de Contatos */
.table-responsive{
  width:100%;
  overflow-x:auto;
  border-radius:8px;
  border:1px solid rgba(0,0,0,0.08);
}
body.tema-escuro .table-responsive{
  border:1px solid rgba(255,255,255,0.08);
}
table{
  width:100%;
  border-collapse:collapse;
  text-align:left;
  font-size:14px;
}
th, td{
  padding:12px 14px;
  border-bottom:1px solid rgba(0,0,0,0.06);
}
body.tema-escuro th, body.tema-escuro td{
  border-bottom:1px solid rgba(255,255,255,0.06);
}
th{
  background:rgba(0,0,0,0.02);
  font-weight:600;
  color:var(--muted);
}
body.tema-escuro th{
  background:rgba(255,255,255,0.02);
}

.actions-row{
  display:flex;
  gap:6px;
}
.btn{
  padding:8px 12px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  transition:opacity 0.2s;
}
.btn.primary{background:var(--azul);color:#fff}
.btn.success{background:var(--verde);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;border:1px solid rgba(0,0,0,0.1);color:inherit}
body.tema-escuro .btn.ghost{border:1px solid rgba(255,255,255,0.2)}

/* Modal */
.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.5);
  display:none;align-items:center;justify-content:center;
  padding:16px;
  z-index:99;
}
.modal{
  background:var(--card);
  padding:20px;
  border-radius:var(--radius);
  width:100%;
  max-width:420px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow:var(--sombra);
}
.form-group{
  display:flex;
  flex-direction:column;
  gap:4px;
}
.form-group label{font-size:12px;font-weight:600;color:var(--muted)}

.footer{
  padding:12px 18px;
  background:linear-gradient(180deg,rgba(0,0,0,0.02),transparent);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.footer small{color:var(--muted)}
</style>
</head>
<body>

<div class="page">
  <div class="container">
    <header class="header">
      <div>
        <h1>Contatos & Moradores</h1>
        <div class="meta">Condomínio Acapulco — Portaria</div>
      </div>
      <div style="margin-left:auto; display:flex; gap:8px">
        <button id="toggleTemaBtn" class="btn ghost" title="Alternar tema">🌗</button>
        <button onclick="window.location.href='index.html'" class="btn ghost">⬅ Voltar</button>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <input type="text" id="inputBusca" class="form-control search-input" placeholder="🔍 Filtrar por quadra, lote, nome ou telefone..." />
        <button id="btnAbrirModal" class="btn success">+ Cadastrar Contato</button>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Quadra / Lote</th>
              <th>Nome do Morador</th>
              <th>Telefone / WhatsApp</th>
              <th>Observações / Portaria</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaContatos">
            <tr><td colspan="5" style="text-align:center; color:var(--muted)">Carregando lista de contatos...</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer class="footer">
      <small>Correspondências Acapulco • Sistema de Portaria</small>
      <div id="statusText">Pronto</div>
    </footer>
  </div>
</div>

<!-- Modal Cadastro/Edição de Contato -->
<div id="modalContato" class="modal-overlay">
  <div class="modal">
    <h3 style="margin:0 0 8px 0">Cadastro de Contato da Unidade</h3>
    <div class="form-group">
      <label>Quadra / Lote</label>
      <input type="text" id="txtQuadraLote" class="form-control" placeholder="Ex: Q. 12 - L. 05" />
    </div>
    <div class="form-group">
      <label>Nome do Morador</label>
      <input type="text" id="txtNomeMorador" class="form-control" placeholder="Ex: Carlos Eduardo" />
    </div>
    <div class="form-group">
      <label>Telefone / WhatsApp</label>
      <input type="text" id="txtTelefone" class="form-control" placeholder="(16) 99999-9999" />
    </div>
    <div class="form-group">
      <label>Observações para a Portaria</label>
      <input type="text" id="txtObs" class="form-control" placeholder="Ex: Autorizado veículo específico, etc." />
    </div>
    <div style="display:flex; gap:8px; margin-top:8px">
      <button id="btnSalvarContato" class="btn success" style="flex:1">Salvar</button>
      <button id="btnFecharModal" class="btn ghost" style="flex:1">Cancelar</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_AUTH_DOMAIN.firebaseapp.com",
    projectId: "SEU_PROJECT_ID",
    storageBucket: "SEU_STORAGE_BUCKET.appspot.com",
    messagingSenderId: "SEU_MESSAGING_SENDER_ID",
    appId: "SEU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let listaGlobalContatos = [];

  function setStatus(msg){ document.getElementById('statusText').textContent = msg; }

  /* TEMA */
  const btnTema = document.getElementById('toggleTemaBtn');
  if (localStorage.getItem('acapulco_tema_v2') === 'escuro') document.body.classList.add('tema-escuro');
  btnTema.onclick = () => {
    const escuro = document.body.classList.toggle('tema-escuro');
    localStorage.setItem('acapulco_tema_v2', escuro ? 'escuro' : 'claro');
  };

  /* MODAL */
  const modal = document.getElementById('modalContato');
  document.getElementById('btnAbrirModal').onclick = () => modal.style.display = 'flex';
  document.getElementById('btnFecharModal').onclick = () => modal.style.display = 'none';

  /* CARREGAR CONTATOS */
  async function carregarContatos(){
    try {
      setStatus('Carregando contatos...');
      const querySnapshot = await getDocs(collection(db, 'contatos'));
      listaGlobalContatos = [];
      querySnapshot.forEach((docSnap) => {
        listaGlobalContatos.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderizarTabela(listaGlobalContatos);
      setStatus('Pronto');
    } catch(e){
      console.error(e);
      setStatus('Erro ao carregar');
      document.getElementById('tabelaContatos').innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--danger)">Erro ao carregar o Firestore.</td></tr>`;
    }
  }

  function renderizarTabela(dados){
    const tbody = document.getElementById('tabelaContatos');
    tbody.innerHTML = '';

    if(dados.length === 0){
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--muted)">Nenhum contato cadastrado.</td></tr>`;
      return;
    }

    dados.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${c.quadraLote || '-'}</strong></td>
        <td>${c.nome || '-'}</td>
        <td>${c.telefone ? `<a href="https://wa.me/55${c.telefone.replace(/\D/g,'')}" target="_blank" style="color:var(--verde); text-decoration:none">💬 ${c.telefone}</a>` : '-'}</td>
        <td style="color:var(--muted); font-size:13px;">${c.obs || '-'}</td>
        <td>
          <div class="actions-row">
            <button class="btn danger" onclick="removerContato('${c.id}')">Excluir</button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  /* BUSCA INSTANTÂNEA */
  document.getElementById('inputBusca').oninput = (e) => {
    const termo = e.target.value.toLowerCase();
    const filtrados = listaGlobalContatos.filter(c => 
      (c.quadraLote && c.quadraLote.toLowerCase().includes(termo)) ||
      (c.nome && c.nome.toLowerCase().includes(termo)) ||
      (c.telefone && c.telefone.includes(termo)) ||
      (c.obs && c.obs.toLowerCase().includes(termo))
    );
    renderizarTabela(filtrados);
  };

  /* SALVAR CONTATO */
  document.getElementById('btnSalvarContato').onclick = async () => {
    const quadraLote = document.getElementById('txtQuadraLote').value.trim();
    const nome = document.getElementById('txtNomeMorador').value.trim();
    const telefone = document.getElementById('txtTelefone').value.trim();
    const obs = document.getElementById('txtObs').value.trim();

    if(!quadraLote || !nome){
      alert('Preencha pelo menos a Quadra/Lote e o Nome.');
      return;
    }

    try {
      setStatus('Salvando...');
      await addDoc(collection(db, 'contatos'), { quadraLote, nome, telefone, obs });
      modal.style.display = 'none';
      document.getElementById('txtQuadraLote').value = '';
      document.getElementById('txtNomeMorador').value = '';
      document.getElementById('txtTelefone').value = '';
      document.getElementById('txtObs').value = '';
      await carregarContatos();
      alert('✅ Contato salvo com sucesso!');
    } catch(e){
      console.error(e);
      alert('Erro ao salvar no banco.');
      setStatus('Erro');
    }
  };

  /* EXCLUIR */
  window.removerContato = async function(id){
    if(confirm('Tem certeza que deseja apagar este contato?')){
      try {
        setStatus('Removendo...');
        await deleteDoc(doc(db, 'contatos', id));
        await carregarContatos();
        alert('Contato removido.');
      } catch(e){
        console.error(e);
        alert('Erro ao excluir.');
      }
    }
  };

  window.addEventListener('load', carregarContatos);
</script>
</body>
</html>

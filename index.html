<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Painel da Portaria — Portaria Acapulco</title>

<style>
:root{
  --azul:#1f2b48;
  --verde:#1fb954;
  --fundo:#f0f2f5;
  --card:#ffffff;
  --muted:#6b7280;
  --danger:#e74c3c;
  --success:#16a34a;
  --sombra: 0 8px 30px rgba(15,23,42,0.12);
  --radius:12px;
  --max-width:760px;
}

body{
  font-family: Inter, "Segoe UI", Arial, sans-serif; 
  margin:0; 
  color:#111;
  background-color: var(--fundo);
  -webkit-font-smoothing:antialiased; 
  -moz-osx-font-smoothing:grayscale;
}

body.tema-escuro{
  --fundo:#0b1220;
  --card:#1e293b;
  color:#e6eef8;
}

.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px;
}
.container{
  width:100%;
  max-width:var(--max-width);
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--sombra);
  overflow:hidden;
}

.header{
  display:flex;
  gap:12px;
  align-items:center;
  padding:18px;
  background:linear-gradient(180deg,var(--azul),#16345f);
  color:#fff;
}
.brand h1{font-size:18px;margin:0}
.header .meta{font-size:13px;color:rgba(255,255,255,0.85)}

.content{
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.form-group label{
  font-size:13px;
  font-weight:600;
  color:var(--muted);
}
.form-control{
  padding:10px 12px;
  border-radius:8px;
  border:1px solid rgba(0,0,0,0.15);
  font-size:15px;
  background:inherit;
  color:inherit;
}
body.tema-escuro .form-control{
  border:1px solid rgba(255,255,255,0.15);
}

.camera-box{
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:center;
  background:rgba(0,0,0,0.02);
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(0,0,0,0.04);
}
body.tema-escuro .camera-box{
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.06);
}

video, canvas {
  width: 100%;
  max-width: 400px;
  border-radius: 8px;
  background: #000;
  display: none;
}

.fotos-preview{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:6px;
}
.fotos-preview img{
  width:80px;
  height:80px;
  border-radius:8px;
  object-fit:cover;
  border:1px solid #ddd;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.btn{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:600;
  font-size:15px;
  transition:opacity 0.2s;
}
.btn.primary{background:var(--azul);color:#fff}
.btn.success{background:var(--verde);color:#fff}
.btn.ghost{background:transparent;border:1px solid rgba(0,0,0,0.1);color:inherit}
.btn[disabled]{opacity:0.5;cursor:not-allowed}

.footer{
  padding:12px 18px;
  background:linear-gradient(180deg,rgba(0,0,0,0.02),transparent);
  display:flex;
  align-items:center;
  justify-content:between;
}
.footer small{color:var(--muted)}
</style>
</head>
<body>

<div class="page">
  <div class="container">
    <header class="header">
      <div>
        <h1>Nova Encomenda</h1>
        <div class="meta">Portaria Acapulco — Registro de Chegada</div>
      </div>
      <div style="margin-left:auto">
        <button id="toggleTemaBtn" class="btn ghost" title="Alternar tema">🌗 Tema</button>
      </div>
    </header>

    <main class="content">
      <div class="form-group">
        <label for="selectMorador">Morador / Apartamento</label>
        <select id="selectMorador" class="form-control">
          <option value="">Selecione o morador...</option>
          <option value="Carlos - 00000">Carlos - 00000</option>
          <!-- Adicione mais moradores conforme necessário -->
        </select>
      </div>

      <div class="form-group">
        <label for="selectEntrega">Tipo de Encomenda</label>
        <select id="selectEntrega" class="form-control">
          <option value="Shopee">Shopee</option>
          <option value="Mercado Livre">Mercado Livre</option>
          <option value="Correios">Correios</option>
          <option value="Amazon">Amazon</option>
          <option value="Outros">Outros</option>
        </select>
      </div>

      <div class="camera-box">
        <label style="font-weight:600;font-size:13px">Capturar Foto da Encomenda (Máx. 3)</label>
        <div>
          <button id="btnAbrirCamera" class="btn ghost" type="button">📸 Abrir Câmera</button>
          <button id="btnCapturar" class="btn primary" type="button" style="display:none">🔘 Capturar</button>
          <button id="btnFecharCamera" class="btn ghost" type="button" style="display:none">✖ Fechar</button>
        </div>

        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

        <div class="form-group" style="width:100%">
          <span style="font-size:12px;color:var(--muted)">Pré-visualização das fotos:</span>
          <div id="fotosContainer" class="fotos-preview">Nenhuma foto tirada.</div>
        </div>
      </div>

      <button id="btnSalvarRegistro" class="btn success" disabled>💾 Salvar e Gerar Link de Assinatura</button>
    </main>

    <footer class="footer">
      <small>Portaria Acapulco • Sistema Interno</small>
      <div id="statusText">Pronto</div>
    </footer>
  </div>
</div>

<!-- Firebase SDKs (Apenas Firestore) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_AUTH_DOMAIN.firebaseapp.com",
    projectId: "SEU_PROJECT_ID",
    storageBucket: "SEU_STORAGE_BUCKET.appspot.com",
    messagingSenderId: "SEU_MESSAGING_SENDER_ID",
    appId: "SEU_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let fotosArray = [];
  let streamCamera = null;

  function setStatus(msg) {
    document.getElementById('statusText').textContent = msg;
  }

  /* TEMA */
  const btnTema = document.getElementById('toggleTemaBtn');
  if (localStorage.getItem('acapulco_tema_v2') === 'escuro') document.body.classList.add('tema-escuro');
  btnTema.onclick = () => {
    const escuro = document.body.classList.toggle('tema-escuro');
    localStorage.setItem('acapulco_tema_v2', escuro ? 'escuro' : 'claro');
  };

  /* CONTROLE DA CÂMERA */
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const btnAbrir = document.getElementById('btnAbrirCamera');
  const btnCapturar = document.getElementById('btnCapturar');
  const btnFechar = document.getElementById('btnFecharCamera');

  btnAbrir.onclick = async () => {
    try {
      streamCamera = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = streamCamera;
      video.style.display = 'block';
      btnAbrir.style.display = 'none';
      btnCapturar.style.display = 'inline-block';
      btnFechar.style.display = 'inline-block';
    } catch (err) {
      alert('Erro ao acessar a câmera. Verifique as permissões do navegador.');
    }
  };

  btnFechar.onclick = () => {
    if (streamCamera) {
      streamCamera.getTracks().forEach(t => t.stop());
    }
    video.style.display = 'none';
    btnCapturar.style.display = 'none';
    btnFechar.style.display = 'none';
    btnAbrir.style.display = 'inline-block';
  };

  btnCapturar.onclick = () => {
    if (fotosArray.length >= 3) {
      alert('Máximo de 3 fotos atingido.');
      return;
    }
    const context = canvas.getContext('2d');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    const base64Img = canvas.toDataURL('image/jpeg', 0.7);
    fotosArray.push(base64Img);
    atualizarPreviaFotos();
  };

  function atualizarPreviaFotos() {
    const container = document.getElementById('fotosContainer');
    container.innerHTML = '';
    fotosArray.forEach((imgBase64) => {
      const img = document.createElement('img');
      img.src = imgBase64;
      container.appendChild(img);
    });

    const btnSalvar = document.getElementById('btnSalvarRegistro');
    if (fotosArray.length > 0) {
      btnSalvar.disabled = false;
    }
  }

  /* SALVAR NO FIRESTORE */
  document.getElementById('btnSalvarRegistro').onclick = async () => {
    const morador = document.getElementById('selectMorador').value;
    const entrega = document.getElementById('selectEntrega').value;

    if (!morador) {
      alert('Selecione o morador.');
      return;
    }

    try {
      setStatus('Salvando registro...');
      document.getElementById('btnSalvarRegistro').disabled = true;

      // Cria objeto com até 3 fotos convertidas direto em Base64 (evita erro de Storage/CORS)
      const dadosRegistro = {
        nome: morador,
        entrega: entrega,
        data: serverTimestamp(),
        status: 'Pendente',
        foto_url: fotosArray[0] || null,
        foto_url_2: fotosArray[1] || null,
        foto_url_3: fotosArray[2] || null,
        assinatura_url: null
      };

      const docRef = await addDoc(collection(db, 'registros'), dadosRegistro);
      
      setStatus('Salvo com sucesso!');
      alert('✅ Encomenda registrada com sucesso!');

      // Gera o link para a página de assinatura passando o ID gerado na URL
      const urlAssinatura = `assinatura.html?registro=${docRef.id}`;
      
      if (confirm('Deseja abrir agora a tela para o morador assinar?')) {
        window.location.href = urlAssinatura;
      } else {
        location.reload();
      }

    } catch (e) {
      console.error(e);
      alert('Erro ao salvar no Firestore. Verifique o console.');
      setStatus('Erro');
      document.getElementById('btnSalvarRegistro').disabled = false;
    }
  };
</script>
</body>
</html>
